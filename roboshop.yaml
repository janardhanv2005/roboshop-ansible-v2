- name: create roboshop ec2 and route53 record
  hosts: local
  connection: local
  vars:
    instances: ["mongodb", "redis", "mysql", "rabbitmq", "catalogue", "user", "cart", "shipping", "payment", "frontend"]
    #instances: ["shipping", "payment", "frontend"]
    ami_id: ami-0055977a6e828a4f4
    instance_type: t3.micro
    region_name: us-east-1
    domain_name: mithul.space
    action: delete
  tasks:
  - name: Launch EC2 instance
    amazon.aws.ec2_instance:
      name: roboshop-{{item}}
      image_id: "{{ ami_id }}"
      instance_type: "{{ instance_type }}"
      security_groups:
        - roboshop-common
        - "roboshop-{{item}}"
      region: "{{ region_name }}"
    loop: "{{ instances }}"
    when: action == "create"
    register: ec2_output

    
  - name: create R53 record
    amazon.aws.route53:
      state: present
      zone: "{{ domain_name }}"
      record: "{{ item.item }}.{{ domain_name }}"
      type: A
      ttl: 1
      value: "{{ item.instances[0].private_ip_address }}"
      overwrite: true
    loop: "{{ ec2_output.results }}"
    when: action == "create"

  - name: create R53 record for frontend
    amazon.aws.route53:
        state: present
        zone: "{{ domain_name }}"
        record: "{{ domain_name }}" # mithul.space points to frontend public IP
        type: A
        ttl: 1
        value: "{{ item.instances[0].public_ip_address }}"
        overwrite: true
    loop: "{{ ec2_output.results }}"
    when: action == "create" and item.item == "frontend"

  - name: remove route53 record
    amazon.aws.route53:
      state: absent
      zone: "{{ domain_name }}"
      record: "{{ item }}.{{ domain_name }}"
      type: A
    loop: "{{ instances }}"
    when: action == "delete"

  - name: delete R53 record for frontend
    amazon.aws.route53:
      state: absent
      zone: "{{ domain_name }}"
      record: "{{ domain_name }}"
      ttl: 1
      type: A
    when: action == "delete" 

  - name: terminate EC2
    amazon.aws.ec2_instance:
      state: absent
      region: "{{ region_name }}"
      name: "roboshop-{{item}}"
    loop: "{{ instances }}"
    when: action == "delete"