- name: node js setup
  include_roles: 
    name: common
    tasks_from: nodejs-setup.yaml

- name: app setup
  include_roles: 
    name: common
    tasks_from: app-setup.yaml

- name: copy mongo db repo file
  copy:
    src: mongo.repo
    dest: /etc/yum.repos.d/mongo.repo

- name: install mongodb client
  dnf:
    name: mongodb-mongosh
    state: present
- name: check products loaded or not
  command: mongosh --host "{{ mongodb_host }}" --quiet --eval 'db.getSiblingDB("catalogue").products.countDocuments()'
  register: product_count

- name: print product_count
  debug:
    msg: "{{ product_count }}"

- name: load the products
  shell: mongosh --host "{{ mongodb_host }}" < /app/db/master-data.js
  when: product_count.stdout | int == 0

- name: systemd service
  include_roles: 
    name: common
    tasks_from: systemd-service.yaml

- name: service restart
  include_roles: 
    name: common
    tasks_from: service-restart.yaml