- name: Install and configure all Roboshop components
  hosts: all
  become: yes
  
  tasks:
    - name: Install and configure components
      ansible.builtin.include_role:
        name: "{{ item }}"
      loop:
        - mongodb
        - redis
        - mysql
        - rabbitmq
        - catalogue
        - cart
        - user
        - shipping
        - payment
        - frontend